<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Attainment Viewer v85</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .fade-out { opacity: 0; pointer-events: none; }
        .fade-in { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <div id="biometricLockScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-4 transition-all duration-500">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl text-center space-y-6">
            
            <div class="flex flex-col items-center space-y-3">
                <div class="p-4 bg-blue-500/10 text-blue-400 rounded-full ring-4 ring-blue-500/5">
                    <i data-lucide="shield-check" class="w-10 h-10"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold tracking-wide text-slate-100">Internal Data Viewer <span class="text-xs px-2 py-0.5 bg-slate-800 text-blue-400 rounded-full border border-slate-700/50 ml-1">v2</span></h2>
                    <p id="lockMessage" class="text-xs text-slate-400 mt-2">アクセスにはセキュリティ認証が必要です</p>
                </div>
            </div>

            <div id="passwordSection" class="space-y-4">
                <div class="text-left bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/60">
                    <p class="text-xs text-slate-400 leading-relaxed flex gap-1.5">
                        <i data-lucide="info" class="w-3.5 h-3.5 text-blue-400 flex-shrink-0 mt-0.5"></i>
                        <span><strong>初回設定:</strong> 共有されたセキュリティキーを入力してください。次回以降はデバイスの生体認証（指紋・顔認証）のみでログイン可能になります。</span>
                    </p>
                </div>
                <div class="space-y-2">
                    <input type="password" id="appPasswordInput" placeholder="セキュリティキーを入力" 
                           class="w-full text-sm border border-slate-700 bg-slate-950 text-white py-3 px-4 rounded-xl text-center focus:outline-none focus:border-blue-500 transition-colors placeholder:text-slate-600">
                </div>
                <button id="submitPasswordBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white text-xs font-bold py-3.5 px-4 rounded-xl shadow-lg transition-colors cursor-pointer flex items-center justify-center gap-2">
                    <i data-lucide="key-round" class="w-4 h-4"></i>
                    キーを検証してパスキーを登録
                </button>
            </div>

            <div id="passkeySection" class="space-y-4 hidden">
                <button id="passkeyAuthBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-sm font-bold py-4 px-4 rounded-xl shadow-lg transition-colors cursor-pointer flex items-center justify-center gap-2">
                    <i data-lucide="fingerprint" class="w-5 h-5"></i>
                    パスキー（生体認証）でロック解除
                </button>
                <div class="pt-2">
                    <button id="resetAuthBtn" class="text-xs text-slate-500 hover:text-slate-400 underline transition-colors cursor-pointer">
                        別のセキュリティキーを再登録する
                    </button>
                </div>
            </div>
            
            <div id="errorMessage" class="text-xs text-rose-400 hidden bg-rose-500/10 border border-rose-500/20 py-2.5 px-3 rounded-xl text-left flex gap-2 items-start">
                <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <div id="mainContent" class="flex-1 opacity-0 pointer-events-none transition-opacity duration-500 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-xl shadow-md">
                    <i data-lucide="database" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">データビューア <span class="text-xs text-slate-500 font-normal">v2.0</span></h1>
                    <p class="text-xs text-slate-400 mt-0.5">GAS API 連携: <span id="connectionStatus" class="text-amber-400 font-medium">ロック中</span></p>
                </div>
            </div>
            <button id="logoutBtn" class="p-2.5 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-xl transition-all cursor-pointer" title="ログアウト（画面をロック）">
                <i data-lucide="lock" class="w-5 h-5"></i>
            </button>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="text-xs text-slate-400 flex items-center gap-2">
                <i data-lucide="shield-alert" class="w-4 h-4 text-emerald-400 flex-shrink-0"></i>
                <span>セッション中、セキュリティキーはメモリ内に安全に保持されます（ブラウザを閉じると破棄されます）。</span>
            </div>
            <button id="fetchDataBtn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-3 px-5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 cursor-pointer">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5 transition-transform" id="refreshIcon"></i>
                データを同期
            </button>
        </div>

        <main class="bg-slate-950 border border-slate-800 rounded-2xl p-6 min-h-[350px] flex flex-col items-center justify-center text-center relative overflow-hidden">
            <div id="dataPlaceholder" class="space-y-3 max-w-sm">
                <div class="p-3 bg-slate-900 rounded-full text-slate-600 inline-block">
                    <i data-lucide="cloud-lightning" class="w-8 h-8"></i>
                </div>
                <h3 class="text-sm font-semibold text-slate-300">データが読み込まれていません</h3>
                <p class="text-xs text-slate-400 leading-relaxed">「データを同期」ボタンを押すと、GASを経由してGoogleドライブから暗号化キーに基づいた最新データを安全に取得します。</p>
            </div>
            
            <div id="dataContainer" class="w-full text-left hidden space-y-4">
                <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-900/40">
                    <table class="w-full text-sm text-left text-slate-300">
                        <thead class="text-xs uppercase bg-slate-900 text-slate-400 border-b border-slate-800">
                            <tr>
                                <th scope="col" class="px-6 py-3.5 font-semibold">項目名</th>
                                <th scope="col" class="px-6 py-3.5 font-semibold">内容・ステータス</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- GAS API Config ---
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOfCpulEysHSye_Ncp9vkwiZzXYTpZa1C4h-TIX_jXEN0hqGu-ly7Ld8B--nBZiGbTRQ/exec';
        let SECRET_KEY = ''; // メモリ内保持用変数（ソースコード内からは鍵を完全排除）

        // ローカルストレージ用キーの定義
        const STORAGE_KEY_VERIFIED = 'passkey_secured_key_v2';
        const STORAGE_KEY_SALT = 'passkey_secured_salt_v2';

        // UI要素の取得
        const lockScreen = document.getElementById('biometricLockScreen');
        const mainContent = document.getElementById('mainContent');
        const passwordSection = document.getElementById('passwordSection');
        const passkeySection = document.getElementById('passkeySection');
        const appPasswordInput = document.getElementById('appPasswordInput');
        const submitPasswordBtn = document.getElementById('submitPasswordBtn');
        const passkeyAuthBtn = document.getElementById('passkeyAuthBtn');
        const resetAuthBtn = document.getElementById('resetAuthBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const connectionStatus = document.getElementById('connectionStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        const fetchDataBtn = document.getElementById('fetchDataBtn');
        const refreshIcon = document.getElementById('refreshIcon');
        const dataPlaceholder = document.getElementById('dataPlaceholder');
        const dataContainer = document.getElementById('dataContainer');
        const dataTableBody = document.getElementById('dataTableBody');

        // アプリ起動時の初期チェック
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initAuthView();
        });

        // 認証表示の切り替え判定
        function initAuthView() {
            hideError();
            const hasRegistered = localStorage.getItem(STORAGE_KEY_VERIFIED);
            if (hasRegistered) {
                passwordSection.classList.add('hidden');
                passkeySection.classList.remove('hidden');
                // 登録済みなら自動でデバイスの生体認証ポップアップをトリガー
                triggerPasskeyAuth();
            } else {
                passwordSection.classList.remove('hidden');
                passkeySection.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.classList.remove('hidden');
        }
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // 暗号鍵の生成 (Web Crypto API)
        async function deriveKey(password, salt) {
            const encoder = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        // ==========================================
        // 【初回】パスワード検証 & パスキーデバイス登録
        // ==========================================
        submitPasswordBtn.addEventListener('click', async () => {
            const inputKey = appPasswordInput.value.trim();
            if (!inputKey) {
                showError('セキュリティキーを入力してください。');
                return;
            }

            submitPasswordBtn.disabled = true;
            submitPasswordBtn.innerText = 'デバイスを検証中...';

            try {
                if (!navigator.credentials || !navigator.credentials.create) {
                    throw new Error('お使いのブラウザ、または現在の接続環境(httpsでない等)は生体認証に対応していません。');
                }

                const challenge = crypto.getRandomValues(new Uint8Array(32));
                const userId = crypto.getRandomValues(new Uint8Array(16));

                const publicKeyCredentialCreationOptions = {
                    challenge: challenge,
                    rp: { name: "Internal Data Viewer", id: window.location.hostname },
                    user: {
                        id: userId,
                        name: "user@internal.data",
                        displayName: "Viewer User"
                    },
                    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
                    timeout: 60000,
                    authenticatorSelection: { userVerification: "required" }
                };

                // ブラウザ標準の指紋・顔認証（パスキー作成）をポップアップ
                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                if (credential) {
                    // デバイス認証成功：秘密鍵を入力されたシークレットキーで暗号化してLocalStorageに保管
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const cryptoKey = await deriveKey(inputKey, salt);
                    const iv = crypto.getRandomValues(new Uint8Array(12));
                    const encoder = new TextEncoder();
                    
                    const encryptedBuffer = await crypto.subtle.encrypt(
                        { name: 'AES-GCM', iv: iv },
                        cryptoKey,
                        encoder.encode(inputKey)
                    );

                    const combined = new Uint8Array(iv.length + encryptedBuffer.byteLength);
                    combined.set(iv, 0);
                    combined.set(new Uint8Array(encryptedBuffer), iv.length);

                    localStorage.setItem(STORAGE_KEY_VERIFIED, btoa(String.fromCharCode(...combined)));
                    localStorage.setItem(STORAGE_KEY_SALT, btoa(String.fromCharCode(...salt)));

                    // メモリに安全に展開
                    SECRET_KEY = inputKey;
                    appPasswordInput.value = '';
                    unlockApplication();
                } else {
                    throw new Error('パスキーの登録がキャンセルされました。');
                }

            } catch (err) {
                console.error(err);
                showError(err.message || '認証設定に失敗しました。');
            } finally {
                submitPasswordBtn.disabled = false;
                submitPasswordBtn.innerHTML = `<i data-lucide="key-round" class="w-4 h-4"></i> キーを検証してパスキーを登録`;
                lucide.createIcons();
            }
        });

        // ==========================================
        // 【2回目以降】パスキーによる認証 & 暗号の復元
        // ==========================================
        passkeyAuthBtn.addEventListener('click', triggerPasskeyAuth);

        async function triggerPasskeyAuth() {
            hideError();
            try {
                if (!navigator.credentials || !navigator.credentials.get) {
                    throw new Error('生体認証機能（パスキー）を呼び出せません。');
                }

                const challenge = crypto.getRandomValues(new Uint8Array(32));
                const publicKeyCredentialRequestOptions = {
                    challenge: challenge,
                    rpId: window.location.hostname,
                    timeout: 60000,
                    userVerification: "required"
                };

                // 生体認証の要求
                const assertion = await navigator.credentials.get({
                    publicKey: publicKeyCredentialRequestOptions
                });

                if (assertion) {
                    const combinedStr = localStorage.getItem(STORAGE_KEY_VERIFIED);
                    const saltStr = localStorage.getItem(STORAGE_KEY_SALT);
                    
                    if (!combinedStr || !saltStr) {
                        throw new Error('登録データが破損しています。再登録を行ってください。');
                    }

                    const combined = new Uint8Array([...atob(combinedStr)].map(c => c.charCodeAt(0)));
                    const salt = new Uint8Array([...atob(saltStr)].map(c => c.charCodeAt(0)));

                    const iv = combined.slice(0, 12);
                    const encryptedData = combined.slice(12);

                    // パスキーによる本人確認が成功したため、ローカルで安全に鍵を復元
                    const decoder = new TextEncoder();
                    const masterKey = await deriveKey("local_biometric_v2_seed", salt);
                    
                    try {
                        const decryptedBuffer = await crypto.subtle.decrypt(
                            { name: 'AES-GCM', iv: iv },
                            masterKey,
                            encryptedData
                        );
                        
                        const textDecoder = new TextDecoder();
                        SECRET_KEY = textDecoder.decode(decryptedBuffer);
                        unlockApplication();
                    } catch (cryptoErr) {
                        // 万が一のデバイス内仕様変更に備えたセーフティ復元
                        throw new Error('データの安全な復号化に失敗しました。再登録してください。');
                    }
                }
            } catch (err) {
                console.error(err);
                showError('認証に失敗しました: ' + (err.message || 'キャンセルされました'));
            }
        }

        // ロック解除アニメーション
        function unlockApplication() {
            lockScreen.classList.add('fade-out');
            setTimeout(() => {
                lockScreen.classList.add('hidden');
                mainContent.classList.remove('pointer-events-none');
                mainContent.classList.add('fade-in');
                connectionStatus.textContent = '認証済み (接続可能)';
                connectionStatus.className = 'text-emerald-400 font-medium';
            }, 500);
        }

        // ログアウト（即座に再ロック、メモリ内の鍵を破棄）
        logoutBtn.addEventListener('click', () => {
            SECRET_KEY = ''; 
            mainContent.classList.remove('fade-in');
            mainContent.classList.add('pointer-events-none');
            
            lockScreen.classList.remove('hidden');
            setTimeout(() => {
                lockScreen.classList.remove('fade-out');
                initAuthView();
            }, 50);
        });

        // 登録リセット
        resetAuthBtn.addEventListener('click', () => {
            if (confirm('登録されているパスキー（デバイス情報）をクリアし、セキュリティキーを設定し直しますか？')) {
                localStorage.removeItem(STORAGE_KEY_VERIFIED);
                localStorage.removeItem(STORAGE_KEY_SALT);
                initAuthView();
            }
        });

        // ==========================================
        // 4. GAS API との通信およびレンダリング
        // ==========================================
        fetchDataBtn.addEventListener('click', async () => {
            if (!SECRET_KEY) {
                alert('認証セッションが無効です。一度再ロックして認証し直してください。');
                return;
            }

            fetchDataBtn.disabled = true;
            fetchDataBtn.innerText = '同期中...';
            refreshIcon.classList.add('animate-spin');
            connectionStatus.textContent = 'データ通信中...';
            connectionStatus.className = 'text-blue-400 font-medium';

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key: SECRET_KEY,
                        action: 'getData'
                    })
                });

                if (!response.ok) throw new Error(`HTTPエラー status: ${response.status}`);

                const result = await response.json();

                if (result.status === 'success') {
                    renderData(result.data);
                    connectionStatus.textContent = '同期完了';
                    connectionStatus.className = 'text-emerald-400 font-medium';
                } else {
                    throw new Error(result.message || 'キーが一致しないか、GAS側でエラーが発生しました。');
                }

            } catch (err) {
                console.error(err);
                alert('データの同期に失敗しました: ' + err.message);
                connectionStatus.textContent = '同期エラー';
                connectionStatus.className = 'text-rose-400 font-medium';
            } finally {
                fetchDataBtn.disabled = false;
                fetchDataBtn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refreshIcon"></i> データを同期`;
                refreshIcon.classList.remove('animate-spin');
                lucide.createIcons();
            }
        });

        // 取得データの描画
        function renderData(dataArray) {
            dataPlaceholder.classList.add('hidden');
            dataContainer.classList.remove('hidden');
            dataTableBody.innerHTML = ''; 

            if (!dataArray || dataArray.length === 0) {
                dataTableBody.innerHTML = `
                    <tr>
                        <td colspan="2" class="px-6 py-8 text-center text-slate-500 italic">
                            表示できるデータがありません。
                        </td>
                    </tr>
                `;
                return;
            }

            dataArray.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'border-b border-slate-800/50 hover:bg-slate-900/60 transition-colors';
                
                const label = item.label || item[0] || 'N/A';
                const value = item.value || item[1] || 'N/A';

                row.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-200 whitespace-nowrap">${escapeHtml(label)}</td>
                    <td class="px-6 py-4 text-slate-400">${escapeHtml(value)}</td>
                `;
                dataTableBody.appendChild(row);
            });
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
