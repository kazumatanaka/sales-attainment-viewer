<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>LINE Talk Viewer (Cloud Edition)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* 全体デザインの定義 */
    :root {
      --line-bg: #7493c3;
      --menu-bg: #2c3e50;
      --text-color: #333;
      --my-bubble: #85e249;
      --user-bubble: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif; }
    body { background-color: var(--line-bg); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ヘッダー */
    header { background-color: rgba(0,0,0,0.2); color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; position: relative; }
    header h1 { font-size: 16px; font-weight: bold; }
    .menu-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }

    /* トーク表示エリア */
    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .date-divider { align-self: center; background-color: rgba(0,0,0,0.15); color: white; font-size: 11px; padding: 3px 8px; border-radius: 10px; margin: 10px 0; }
    .msg-row { display: flex; align-items: flex-start; max-width: 80%; gap: 8px; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    
    /* アイコン */
    .icon-wrap { width: 40px; height: 40px; flex-shrink: 0; }
    .icon-wrap img, .icon-wrap .default-icon { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .icon-wrap .default-icon { background-color: #ccc; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold; }
    
    .msg-content { display: flex; flex-direction: column; }
    .user-name { font-size: 11px; color: rgba(255,255,255,0.8); margin-bottom: 2px; }
    .msg-row.me .user-name { display: none; }
    
    .bubble-wrap { display: flex; align-items: flex-end; gap: 5px; }
    .msg-row.me .bubble-wrap { flex-direction: row-reverse; }
    
    .bubble { padding: 8px 12px; border-radius: 15px; font-size: 14px; max-width: 100%; word-break: break-all; white-space: pre-wrap; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg-row.me .bubble { background-color: var(--my-bubble); border-top-right-radius: 2px; }
    .msg-row.other .bubble { background-color: var(--user-bubble); border-top-left-radius: 2px; }
    
    .bubble img { max-width: 200px; max-height: 200px; border-radius: 5px; margin-top: 5px; cursor: pointer; display: block; }
    .time-stamp { font-size: 10px; color: rgba(255,255,255,0.7); flex-shrink: 0; }

    /* サイドメニュー・ドロワー */
    #side-menu { position: fixed; top: 0; right: -320px; width: 320px; height: 100%; background-color: #f8f9fa; box-shadow: -2px 0 10px rgba(0,0,0,0.2); z-index: 100; transition: right 0.3s ease; display: flex; flex-direction: column; color: #333; }
    #side-menu.open { right: 0; }
    .menu-header { background-color: var(--menu-bg); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .menu-body { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    
    .btn { background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 100%; font-weight: bold; transition: background 0.2s; }
    .btn:hover { background-color: #2980b9; }
    .btn.secondary { background-color: #95a5a6; }
    .btn.secondary:hover { background-color: #7f8c8d; }
    .btn.danger { background-color: #e74c3c; }
    .btn.danger:hover { background-color: #c0392b; }

    .section-title { font-size: 13px; font-weight: bold; color: #7f8c8d; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-top: 10px; }
    
    /* ドライブエクスプローラー */
    #explorer { border: 1px solid #ddd; border-radius: 5px; background: white; max-height: 250px; overflow-y: auto; font-size: 12px; }
    .explorer-item { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .explorer-item:hover { background-color: #f1f2f6; }
    .explorer-item.folder { font-weight: bold; color: #e67e22; }
    .explorer-item.image-file { color: #2ecc71; }
    .back-row { background: #eef1f4; font-weight: bold; }

    #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; color: white; z-index: 200; font-size: 16px; }
  </style>
</head>
<body>

  <header>
    <h1 id="talk-title">LINE Talk Viewer</h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
  </header>

  <div id="chat-container">
    </div>

  <div id="side-menu">
    <div class="menu-header">
      <h3>設定 & 管理機能</h3>
      <button class="menu-btn" onclick="toggleMenu()">✕</button>
    </div>
    <div class="menu-body">
      
      <button class="btn" onclick="handleSync()">🔄 クラウドからデータを同期</button>

      <div class="section-title">ドライブ探索 (ファイル選択)</div>
      <div id="explorer-path" style="font-size: 11px; color:#666; word-break:break-all;">現在の階層: root</div>
      <div id="explorer">
        <div class="explorer-item" style="color:#999; text-align:center;">同期後にここにフォルダが表示されます</div>
      </div>
      <button class="btn secondary" id="btn-bulk-load" style="display:none;" onclick="loadCurrentFolderAll()">⚡ このフォルダ内のトークをすべて結合</button>

      <div class="section-title">アイコン管理</div>
      <button class="btn danger" onclick="resetCustomIcon()">👤 カスタムアイコンをリセット</button>

      <div class="section-title">ローカルファイル読み込み (バックアップ用)</div>
      <input type="file" id="local-file-input" accept=".txt" style="font-size:12px;" onchange="loadLocalFile(this)">
    </div>
  </div>

  <div id="loading-overlay">データを処理中...</div>

  <script>
    // ==========================================
    // 【アカウント固定設定】
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/【あなたの新しいデプロイID】/exec";
    const SECRET_KEY = "Osanbashi622";

    // 内部状態管理
    let currentFolderId = "root";
    let folderHistory = [];
    let talkData = []; // 読み込まれた全メッセージ
    let partnerName = "相手";
    let customIconBase64 = null; // ユーザー指定のカスタムアイコン画像

    // アプリ起動時の初期処理
    window.addEventListener('DOMContentLoaded', () => {
      // IndexedDB または LocalStorage から過去のキャッシュやアイコンを復元
      customIconBase64 = localStorage.getItem('line_viewer_custom_icon');
      loadCachedTalk();
    });

    function toggleMenu() {
      document.getElementById('side-menu').classList.toggle('open');
    }

    function showLoading(show) {
      document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
    }

    // 生体認証（Passkey）風のモックまたはそのまま同期
    async function handleSync() {
      showLoading(true);
      try {
        // パスワード入力やURL入力をスキップして直接GASへリクエストを投げます
        await fetchDriveFolder(currentFolderId);
      } catch (err) {
        alert("同期に失敗しました。GASの設定や通信状況を確認してください。");
      } finally {
        showLoading(false);
      }
    }

    // GASからファイル・フォルダ一覧を取得
    async function fetchDriveFolder(folderId) {
      const url = `${GAS_URL}?action=list&folderId=${folderId}&key=${encodeURIComponent(SECRET_KEY)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        alert("認証エラー、またはドライブへのアクセス権限がありません: " + data.error);
        return;
      }

      renderExplorer(data.files || []);
      
      // トークフォルダ内にいる場合は一括結合ボタンを表示
      if (folderId !== "root") {
        document.getElementById('btn-bulk-load').style.display = 'block';
      } else {
        document.getElementById('btn-bulk-load').style.display = 'none';
      }
    }

    // エクスプローラー画面の描画
    function renderExplorer(items) {
      const explorer = document.getElementById('explorer');
      explorer.innerHTML = '';

      // 戻るボタンの追加
      if (folderHistory.length > 0) {
        const backRow = document.createElement('div');
        backRow.className = 'explorer-item back-row';
        backRow.innerHTML = '<span>⬅ 上の階層へ戻る</span>';
        backRow.onclick = () => {
          currentFolderId = folderHistory.pop();
          document.getElementById('explorer-path').innerText = `現在の階層: ${currentFolderId}`;
          handleSync();
        };
        explorer.appendChild(backRow);
      }

      if (items.length === 0) {
        explorer.innerHTML += '<div style="padding:10px; color:#999; text-align:center;">空のフォルダ、または対象ファイルがありません</div>';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('div');
        
        if (item.mimeType === "application/vnd.google-apps.folder") {
          row.className = 'explorer-item folder';
          row.innerHTML = `<span>📁 ${item.name}</span>`;
          row.onclick = () => {
            folderHistory.push(currentFolderId);
            currentFolderId = item.id;
            document.getElementById('explorer-path').innerText = `現在の階層: ${item.name}`;
            handleSync();
          };
        } else if (item.mimeType === "text/plain") {
          row.className = 'explorer-item';
          row.innerHTML = `<span>📄 ${item.name}</span>`;
          row.onclick = () => loadSingleTextFile(item.id);
        } else if (item.mimeType.startsWith("image/")) {
          row.className = 'explorer-item image-file';
          row.innerHTML = `<span>🖼️ ${item.name} <small>(アイコン候補)</small></span>`;
          row.onclick = () => askAndSetCustomIcon(item.id, item.name);
        }
        explorer.appendChild(row);
      });
    }

    // ユーザーに確認してからカスタムアイコンに設定
    async function askAndSetCustomIcon(fileId, fileName) {
      const confirmSetup = confirm(`「${fileName}」を相手のアイコン画像として設定しますか？`);
      if (!confirmSetup) return;

      showLoading(true);
      try {
        const url = `${GAS_URL}?action=getFile&fileId=${fileId}&key=${encodeURIComponent(SECRET_KEY)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.content) {
          customIconBase64 = `data:${data.mimeType};base64,${data.content}`;
          localStorage.setItem('line_viewer_custom_icon', customIconBase64);
          alert("相手のアイコン画像を更新しました！");
          renderChat(); // チャット画面をリフレッシュ
        }
      } catch (err) {
        alert("画像の取得に失敗しました。");
      } finally {
        showLoading(false);
      }
    }

    // アイコンを標準デフォルトにリセットする関数
    function resetCustomIcon() {
      if (!customIconBase64 && !localStorage.getItem('line_viewer_custom_icon')) {
        alert("すでにデフォルト画像が使用されています。");
        return;
      }
      const confirmReset = confirm("カスタムアイコンを削除し、標準のデフォルト画像に戻しますか？");
      if (confirmReset) {
        customIconBase64 = null;
        localStorage.removeItem('line_viewer_custom_icon');
        alert("アイコンをデフォルトに戻しました。");
        renderChat();
      }
    }

    // 単一のテキストファイルをロード
    async function loadSingleTextFile(fileId) {
      showLoading(true);
      try {
        const url = `${GAS_URL}?action=getFile&fileId=${fileId}&key=${encodeURIComponent(SECRET_KEY)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.content) {
          parseLineTalk(data.content);
          saveTalkCache();
          toggleMenu();
        }
      } catch (e) {
        alert("ファイル読み込みエラー");
      } finally {
        showLoading(false);
      }
    }

    // フォルダ内のすべてのテキストと画像を自動でロード・結合
    async function loadCurrentFolderAll() {
      showLoading(true);
      try {
        const listUrl = `${GAS_URL}?action=list&folderId=${currentFolderId}&key=${encodeURIComponent(SECRET_KEY)}`;
        const listRes = await fetch(listUrl);
        const listData = await listRes.json();
        const files = listData.files || [];

        let combinedText = "";
        
        // 1. まずテキストファイルを結合
        for (let file of files) {
          if (file.mimeType === "text/plain") {
            const fileUrl = `${GAS_URL}?action=getFile&fileId=${file.id}&key=${encodeURIComponent(SECRET_KEY)}`;
            const fileRes = await fetch(fileUrl);
            const fileData = await fileRes.json();
            if (fileData.content) {
              combinedText += "\n" + fileData.content;
            }
          }
        }

        if (combinedText.trim() === "") {
          alert("結合できるテキストファイルが見つかりませんでした。");
          return;
        }

        parseLineTalk(combinedText);
        saveTalkCache();
        alert("フォルダ内のトーク履歴を一括結合・同期しました！");
        toggleMenu();

      } catch (err) {
        alert("一括同期中にエラーが発生しました。");
      } finally {
        showLoading(false);
      }
    }

    // バックアップ用：ローカルPCからのTXT読み込み
    function loadLocalFile(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        parseLineTalk(e.target.result);
        saveTalkCache();
        toggleMenu();
      };
      reader.readAsText(file, "UTF-8");
    }

    // LINEトークテキストの簡易パースアルゴリズム
    function parseLineTalk(rawText) {
      talkData = [];
      const lines = rawText.split(/\r?\n/);
      let currentDate = "";
      
      // 最初期の相手の名前抽出ロジック（[LINE] ○○とのトーク履歴）
      if (lines[0] && lines[0].includes("とのトーク")) {
        const match = lines[0].match(/\[LINE\]\s(.*)とのトーク/);
        if (match) partnerName = match[1];
      }
      document.getElementById('talk-title').innerText = `${partnerName} とのトーク`;

      const timeRegex = /^(\d{2}:\d{2})\s+([^\s]+)\s+(.*)$/;

      lines.forEach(line => {
        line = line.trim();
        if (!line) return;

        // 日付行の検出 (例: 2026/06/28(日))
        if (/^\d{4}\/\d{2}\/\d{2}/.test(line)) {
          currentDate = line;
          talkData.push({ type: "date", value: currentDate });
          return;
        }

        // メッセージ行の検出 (例: 12:15 相手 メッセージ内容)
        const match = line.match(timeRegex);
        if (match) {
          const time = match[1];
          const sender = match[2];
          const content = match[3];
          const isMe = (sender === "自分" || sender === "me");

          talkData.push({
            type: "msg",
            time: time,
            sender: sender,
            content: content,
            isMe: isMe
          });
        } else {
          // 複数行にわたるメッセージの継続処理
          if (talkData.length > 0 && talkData[talkData.length - 1].type === "msg") {
            talkData[talkData.length - 1].content += "\n" + line;
          }
        }
      });

      renderChat();
    }

    // チャット画面のHTMLレンダリング
    function renderChat() {
      const container = document.getElementById('chat-container');
      container.innerHTML = '';

      talkData.forEach(item => {
        if (item.type === "date") {
          const div = document.createElement('div');
          div.className = 'date-divider';
          div.innerText = item.value;
          container.appendChild(div);
        } else if (item.type === "msg") {
          const row = document.createElement('div');
          row.className = `msg-row ${item.isMe ? 'me' : 'other'}`;

          // アイコンの構築
          let iconHtml = '';
          if (!item.isMe) {
            iconHtml = `
              <div class="icon-wrap">
                ${customIconBase64 
                  ? `<img src="${customIconBase64}" alt="icon">` 
                  : `<div class="default-icon">${partnerName.charAt(0)}</div>`}
              </div>`;
          }

          row.innerHTML = `
            ${iconHtml}
            <div class="msg-content">
              <span class="user-name">${item.sender}</span>
              <div class="bubble-wrap">
                <div class="bubble">${formatBubbleContent(item.content)}</div>
                <span class="time-stamp">${item.time}</span>
              </div>
            </div>
          `;
          container.appendChild(row);
        }
      });

      // 最下部へスクロール
      container.scrollTop = container.scrollHeight;
    }

    function formatBubbleContent(text) {
      if (text === "[写真]" || text === "[スタンプ]") {
        return `<span style="color:rgba(0,0,0,0.4); font-style:italic;">${text}</span>`;
      }
      return text;
    }

    // キャッシュ保存・読み込みロジック (簡易的なLocalStorage保持)
    function saveTalkCache() {
      try {
        localStorage.setItem('line_viewer_talk_cache', JSON.stringify(talkData));
        localStorage.setItem('line_viewer_partner_name', partnerName);
      } catch (e) {
        console.warn("トークデータの容量が大きく、LocalStorageの制限を超えた可能性があります。");
      }
    }

    function loadCachedTalk() {
      const cache = localStorage.getItem('line_viewer_talk_cache');
      const name = localStorage.getItem('line_viewer_partner_name');
      if (cache) {
        talkData = JSON.parse(cache);
        if (name) partnerName = name;
        document.getElementById('talk-title').innerText = `${partnerName} とのトーク`;
        renderChat();
      }
    }
  </script>
</body>
</html>
